worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;
    # Reuse audio ranges in this browser only; never cache login/error responses.
    map "$uri:$upstream_status" $response_cache_control {
        default $upstream_http_cache_control;
        "~^/api/recordings/[0-9a-f]+/audio:(200|206)$" "private, max-age=300";
    }
    server {
        listen 127.0.0.1:8001;
        client_max_body_size 0;
        client_body_timeout 300s;
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $response_cache_control always;
        }
    }
}
